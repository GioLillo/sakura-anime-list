<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="description" content="Sakura Anime List — a minimal personal anime library.">
  <title>Sakura Anime List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/flower.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="petal-layer" id="petal-layer" aria-hidden="true"></div>
  <svg class="sakura-branch" viewBox="0 0 650 270" aria-hidden="true">
    <defs>
      <radialGradient id="petal-fill"><stop offset="0" stop-color="#ffe0ed"/><stop offset="1" stop-color="#ce82a8"/></radialGradient>
    </defs>
    <path d="M-28 16 C78 62 103 107 185 115 S314 97 386 41 S506 20 675 -26" fill="none" stroke="#59413d" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 78 C132 48 154 28 171 -7 M184 114 C222 80 249 64 281 57 M324 76 C337 39 359 13 391 -5 M426 34 C463 47 494 77 514 107 M220 108 C233 143 244 170 278 190 M80 61 C70 28 73 4 86 -16 M528 3 C555 5 582 13 608 30" fill="none" stroke="#4c3936" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#petal-fill)" stroke="#b96b91" stroke-width="1.1">
      <g transform="translate(68 48)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(135 87) scale(.82)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(174 25) scale(.9)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(225 106) scale(.72)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(303 70) scale(.76)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(365 24) scale(.72)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
      <g transform="translate(485 69) scale(.82)"><ellipse cy="-12" rx="7" ry="12"/><ellipse cx="11" cy="-3" rx="7" ry="12" transform="rotate(65 11 -3)"/><ellipse cx="7" cy="10" rx="7" ry="12" transform="rotate(135 7 10)"/><ellipse cx="-8" cy="9" rx="7" ry="12" transform="rotate(205 -8 9)"/><ellipse cx="-12" cy="-4" rx="7" ry="12" transform="rotate(285 -12 -4)"/><circle r="4" fill="#f6d7a8"/></g>
    </g>
    <g fill="#d68eb0"><ellipse cx="113" cy="19" rx="5" ry="9" transform="rotate(-26 113 19)"/><ellipse cx="265" cy="22" rx="4" ry="8" transform="rotate(31 265 22)"/><ellipse cx="412" cy="72" rx="4" ry="8" transform="rotate(52 412 72)"/><ellipse cx="560" cy="50" rx="4" ry="8" transform="rotate(-22 560 50)"/><ellipse cx="275" cy="201" rx="4" ry="8" transform="rotate(-50 275 201)"/></g>
  </svg>

  <section class="login-screen" id="login-screen" aria-labelledby="auth-title">
    <div class="login-card panel">
      <div class="login-mark">✿</div>
      <div class="login-brand">Sakura Anime List</div>
      <img class="login-avatar" src="assets/avatar-reference.png" alt="Sakura Anime List character">
      <h1 id="auth-title">Sign in</h1>
      <p class="login-description" id="auth-description">Your anime library, wherever you are.</p>
      <div class="login-setup-note hidden" id="login-setup-note">
        <strong>One-time setup</strong>
        <p>Open <code>config.js</code> and add your Supabase Project URL and publishable key. Then reload this page. Do not use a service-role or secret key.</p>
      </div>
      <form id="auth-form">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters">
        <button class="btn btn-primary btn-wide" id="auth-submit" type="submit">Sign in</button>
      </form>
      <button class="text-button login-switch" id="auth-switch" type="button">New here? Create an account</button>
      <div class="auth-feedback" id="auth-feedback" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div id="app-frame" class="hidden">
    <aside class="sidebar" id="sidebar">
      <a href="#home" class="brand" data-view="home" aria-label="Sakura Anime List home">
        <span class="brand-flower">✿</span><span><strong>Sakura Anime List</strong><small>MY ANIME LIBRARY</small></span>
      </a>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="home"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-link" data-view="library"><span class="nav-icon">▤</span>Library</button>
        <button class="nav-link" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="sidebar-avatar" id="sidebar-avatar" data-view="profile" type="button" title="Account" aria-label="Open account">
          <img src="assets/avatar-reference.png" alt="Sakura Anime List character">
          <span class="sidebar-avatar-caption"><strong data-profile-name>Sakura</strong></span>
        </button>
      </div>
    </aside>

    <button class="mobile-profile-link" data-view="profile" type="button" title="Account" aria-label="Open account">
      <img src="assets/avatar-reference.png" alt="Open account">
    </button>

    <div class="app-shell">
      <main id="main-content" class="main-content" tabindex="-1">
        <div class="view" id="view-home"></div>
        <div class="view hidden" id="view-library"></div>
        <div class="view hidden" id="view-profile"></div>
        <div class="view hidden" id="view-settings"></div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="nav-link active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-link" data-view="library"><span>▤</span><small>Library</small></button>
      <button class="nav-link" data-view="settings"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="modal detail-modal"><button class="modal-close" data-close="detail-modal" aria-label="Close">×</button><div id="detail-content"></div></div></div>
  <div class="modal-backdrop hidden" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title"><div class="modal add-modal"><button class="modal-close" data-close="add-modal" aria-label="Close">×</button><div id="add-content"></div></div></div>
  <div class="modal-backdrop hidden" id="podium-picker-modal" role="dialog" aria-modal="true" aria-labelledby="podium-picker-title"><div class="modal podium-picker-modal"><button class="modal-close" data-close="podium-picker-modal" aria-label="Close">×</button><div id="podium-picker-content"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
